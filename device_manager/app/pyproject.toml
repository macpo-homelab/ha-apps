[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "device-manager"
version = "0.4.1"
description = "Verwaltung von Shelly-Geräten mit OPNsense- und Zigbee2MQTT-Integration"
readme = "README.md"
license = "MIT"
authors = [{ name = "macpo" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "paho-mqtt>=2.1",
    "zeroconf>=0.132",
    "cryptography>=43",
]

[project.urls]
Homepage = "https://github.com/macpo-homelab/device-manager"
Issues = "https://github.com/macpo-homelab/device-manager/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pyyaml>=6.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
device-manager = "device_manager.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
device_manager = ["web/templates/*.html", "web/static/*", "web/static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: Tests gegen echte Systeme (OPNsense/Shelly/MQTT), benötigen DM_LIVE_* Variablen",
    "docker: Tests, die Docker benötigen",
]
addopts = "-m 'not live and not docker'"
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "S311", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106", "S107", "S108", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src"]
