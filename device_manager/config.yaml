name: Device Manager
version: "0.4.1"
slug: device_manager
description: Geräte im Heimnetz verwalten – Shelly-Geräte übernehmen, IP in OPNsense reservieren, Firmware und HTTPS-Zertifikate verwalten, Gen4-Zigbee-Geräte aktualisieren
arch:
  - amd64
  - aarch64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:lan-connect
panel_title: Device Manager
# mDNS-Suche und direkter Zugriff auf Geräte im LAN
host_network: true
services:
  - mqtt:want
map:
  - ssl:ro
options:
  shelly_password: ""
  device_networks: []
  wifi_ssid: ""
  wifi_password: ""
  opnsense_url: ""
  opnsense_api_key: ""
  opnsense_api_secret: ""
  opnsense_verify_tls: true
  opnsense_ca_file: ""
  opnsense_reload_unbound: true
  ip_range_start: ""
  ip_range_end: ""
  dns_domain: ""
  cert_ca_name: ""
  cert_lifetime_days: 397
  cert_key_location: firewall
  default_firmware_stage: stable
  shelly_ntp_server: time.cloudflare.com
  shelly_timezone: Europe/Berlin
  shelly_date_format: YYYY-MM-DD
  firmware_reboot_wait: 300
  z2m_base_topic: zigbee2mqtt
  log_level: info
schema:
  shelly_password: password
  device_networks:
    - str
  wifi_ssid: str?
  wifi_password: password?
  opnsense_url: url
  opnsense_api_key: password
  opnsense_api_secret: password
  opnsense_verify_tls: bool
  opnsense_ca_file: str?
  opnsense_reload_unbound: bool
  ip_range_start: match(^(\d{1,3}\.){3}\d{1,3}$)
  ip_range_end: match(^(\d{1,3}\.){3}\d{1,3}$)
  dns_domain: str?
  cert_ca_name: str
  cert_lifetime_days: int(1,3650)
  cert_key_location: list(firewall|local)
  default_firmware_stage: list(stable|beta)
  shelly_ntp_server: str
  shelly_timezone: str
  shelly_date_format: str
  shelly_latitude: float(-90,90)?
  shelly_longitude: float(-180,180)?
  firmware_reboot_wait: int(60,3600)
  firmware_poll_interval: int(2,60)?
  z2m_base_topic: str
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  log_level: list(debug|info|warning|error)
